<style>
  :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  #app { display: grid; grid-template-columns: minmax(0, 1fr) 440px; height: 100vh; height: 100dvh; }
  #map { height: 100%; background: #dfe7ef; }
  #panel { display: flex; flex-direction: column; min-height: 0; background: var(--card); border-left: 1px solid var(--line); }
  #scroll { flex: 1; overflow-y: auto; padding: 16px 18px 12px; }
  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .brand { font-weight: 800; letter-spacing: .05em; font-size: 20px; line-height: 1.1; }
  .brand small { display: block; font-weight: 500; letter-spacing: 0; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .brand a { color: var(--muted); }
  .countdown { font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; padding-top: 3px; }
  .countdown b { color: var(--ink); font-size: 15px; }

  #timeline { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 12px; margin: 0 0 4px; scrollbar-width: thin; }
  #timeline button { flex: 0 0 auto; border: 1px solid var(--line); border-left: 4px solid var(--c); background: #fff;
    border-radius: 8px; padding: 4px 9px; text-align: left; cursor: pointer; font-size: 12.5px; color: var(--ink); font-family: inherit; }
  #timeline button b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  #timeline button.on { background: var(--ink); color: #fff; border-color: var(--ink); border-left-color: var(--c); }
  #timeline button.on b { color: #cbd5e1; }

  .card { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--card);
    box-shadow: 0 1px 2px rgba(15, 23, 42, .05); }
  .photo { position: relative; margin: 0; aspect-ratio: 16 / 10; background: linear-gradient(135deg, var(--soft), #ffffff); }
  .photo { overflow: hidden; cursor: zoom-in; }
  .slides { position: absolute; inset: 0; }
  .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.1s ease; }
  .slide.on { opacity: 1; animation: kb 10s ease-out both; }
  @keyframes kb { from { transform: scale(1.03); } to { transform: scale(1.14); } }
  @media (prefers-reduced-motion: reduce) { .slide.on { animation: none; } }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 96px 10px 12px; color: #fff; font-size: 13px;
    font-weight: 600; line-height: 1.3; background: linear-gradient(transparent, rgba(0, 0, 0, .7)); text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
    pointer-events: none; }
  .g-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 0;
    background: rgba(15, 23, 42, .45); color: #fff; font-size: 22px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .2s; }
  .g-prev { left: 8px; } .g-next { right: 8px; }
  .photo:hover .g-nav { opacity: 1; }
  .dots { position: absolute; right: 44px; bottom: 13px; display: flex; gap: 5px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .5); cursor: pointer; }
  .dots i.on { background: #fff; }
  .g-full { position: absolute; right: 8px; bottom: 6px; width: 30px; height: 30px; border: 0; border-radius: 8px;
    background: rgba(15, 23, 42, .45); color: #fff; font-size: 16px; cursor: pointer; }
  .lb { position: fixed; inset: 0; z-index: 5000; background: rgba(5, 8, 15, .94); display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px; }
  .lb[hidden] { display: none; }
  .lb img { max-width: 94vw; max-height: 80vh; object-fit: contain; border-radius: 6px; box-shadow: 0 10px 40px rgba(0, 0, 0, .6); }
  .lb-cap { color: #e2e8f0; text-align: center; margin-top: 12px; font-size: 14px; max-width: 900px; }
  .lb-cap b { display: block; color: #fff; font-size: 16px; margin-bottom: 3px; }
  .lb-cap a { color: #cbd5e1; }
  .lb-x, .lb-nav { position: absolute; border: 0; background: rgba(255, 255, 255, .12); color: #fff; cursor: pointer; border-radius: 50%; }
  .lb-x { top: 14px; right: 14px; width: 42px; height: 42px; font-size: 20px; }
  .lb-nav { top: 50%; transform: translateY(-50%); width: 48px; height: 48px; font-size: 30px; line-height: 1; }
  .lb-prev { left: 14px; } .lb-next { right: 14px; }
  .rswitch { display: inline-flex; margin: 0 0 10px; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .rswitch a { font-size: 12.5px; font-weight: 700; padding: 4px 11px; text-decoration: none; color: var(--muted); letter-spacing: 0;
    white-space: nowrap; }
  .rswitch a.on { background: var(--ink); color: #fff; }
  .photo .num, .photo .cc { position: absolute; top: 10px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px;
    font-weight: 700; background: rgba(255, 255, 255, .92); color: var(--ink); }
  .photo .num { left: 10px; } .photo .cc { right: 10px; }
  .body { padding: 14px 16px 14px; }
  .kicker { font-size: 13px; color: var(--muted); font-weight: 600; }
  .kicker b { color: var(--ink); }
  h2 { margin: 4px 0 2px; font-size: 23px; line-height: 1.2; }
  .base { color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
  .chip { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #f1f5f9; color: #334155; }
  .chip.t-g { background: #BBF7D0; color: #14532d; } .chip.t-a { background: #FDE68A; color: #78350f; }
  .chip.t-r { background: #FECACA; color: #7f1d1d; }
  .chip.path { background: #111827; color: #fde68a; } .chip.partial { background: #e2e8f0; color: #334155; }
  .chip.badge { background: #ede9fe; color: #4c1d95; }
  .arrive { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; background: #f8fafc; border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; margin: 10px 0 8px; }
  .arrive .ic { font-size: 16px; line-height: 1.25; }
  ul.b { margin: 6px 0 0; padding-left: 18px; font-size: 14.5px; line-height: 1.45; }
  ul.b li { margin: 4px 0; }
  .foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
  .foot a { color: inherit; }

  .card.eclipse { background: #0b1020; border-color: #1f2937; color: #e5e7eb; }
  .card.eclipse .kicker, .card.eclipse .base, .card.eclipse .foot { color: #cbd5e1; }
  .card.eclipse .kicker b, .card.eclipse h2 { color: #fde68a; }
  .card.eclipse .arrive { background: #111827; border-color: #1f2937; }

  #controls { display: flex; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--line); background: var(--card); }
  #controls button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 8px;
    font-size: 14px; font-weight: 700; cursor: pointer; color: var(--ink); font-family: inherit; }
  #controls button.primary { background: var(--ink); color: #fff; border-color: var(--ink); flex: 1.6; }
  #controls button:disabled { opacity: .4; cursor: default; }
  #controls #all { flex: 0 0 52px; }

  .pin-wrap { background: transparent; border: 0; }
  .pin { width: 100%; height: 100%; border-radius: 50%; background: var(--c); color: #fff; font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
    transition: transform .25s; cursor: pointer; font-family: system-ui, sans-serif; }
  .pin.side { font-size: 10.5px; }
  .pin.multi { border-radius: 14px; font-size: 11px; letter-spacing: -.02em; }
  .pin.eclipse { background: #111827; border-color: #f59e0b; font-size: 13px; }
  .pin.current { transform: scale(1.45); box-shadow: 0 0 0 3px rgba(255, 255, 255, .9), 0 0 0 6px var(--c), 0 2px 10px rgba(0, 0, 0, .45); }
  .path-label { background: transparent; border: 0; }
  .path-label div { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-size: 12px; font-weight: 700;
    color: #92400e; background: rgba(255, 251, 235, .94); border: 1px solid #f59e0b; border-radius: 999px; padding: 3px 10px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
  .leg { transition: stroke-width .3s, opacity .3s; }
  .leg.optional { opacity: .55; }
  .leg.active { stroke-width: 5.5px; opacity: 1; }
  .leg.active.leg-flight, .leg.active.leg-ferry, .leg.active.leg-boat, .leg.active.leg-train { animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .legend { background: rgba(255, 255, 255, .94); padding: 8px 10px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
    font-size: 12px; line-height: 1.7; color: #0f172a; }
  .legend i { display: inline-block; width: 24px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 7px; }
  .legend .sw { display: inline-block; width: 24px; height: 10px; background: rgba(11, 18, 32, .25); border: 1px dashed #f59e0b;
    vertical-align: middle; margin-right: 7px; }

  @media (max-width: 880px) {
    #app { display: block; height: auto; }
    #map { position: sticky; top: 0; height: 42vh; height: 42dvh; z-index: 1; }
    #panel { border-left: 0; position: relative; z-index: 2; }
    #scroll { overflow: visible; padding: 12px 14px 8px; }
    #controls { position: sticky; bottom: 0; z-index: 3; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
    .legend { display: none; }
    .g-nav { opacity: 1; width: 30px; height: 30px; font-size: 19px; }
    h2 { font-size: 21px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map" aria-label="Trip map"></div>
  <aside id="panel">
    <div id="scroll">
      <header class="top">
        <div class="brand">ECLIPSE '27<small id="subtitle"></small></div>
        <div class="countdown" id="countdown"></div>
      </header>
      <div class="rswitch" id="rswitch"></div>
      <div id="timeline" aria-label="Stops"></div>
      <article id="card" class="card" aria-live="polite"></article>
    </div>
    <nav id="controls">
      <button id="prev" aria-label="Previous stop">◀ Prev</button>
      <button id="next" class="primary" aria-label="Next stop">Next ▶</button>
      <button id="play" aria-label="Play the trip">▶ Play</button>
      <button id="all" aria-label="Show the whole trip" title="Whole trip">🌍</button>
    </nav>
  </aside>
</div>
<div class="lb" id="lb" hidden>
  <button class="lb-x" id="lbx" aria-label="Close">✕</button>
  <button class="lb-nav lb-prev" id="lbp" aria-label="Previous photo">‹</button>
  <img id="lbimg" alt="">
  <button class="lb-nav lb-next" id="lbn" aria-label="Next photo">›</button>
  <div class="lb-cap"><b id="lbcap"></b><span id="lbcredit"></span></div>

    const h = s.kind === 'side' ? 21 : 27, w = idx.length > 1 ? h + 14 : h;
    return L.divIcon({ className: 'pin-wrap', iconSize: [w, h], iconAnchor: [w / 2, h / 2],
      html: `<div class="pin ${s.kind}${idx.length > 1 ? ' multi' : ''}${current ? ' current' : ''}" style="--c:${C[s.cc].pin}">${label}</div>` });
  }
  const markers = {};
  Object.keys(groups).forEach((k) => {
    const owner = +k, idx = groups[owner], s = S[owner];
    const mk = L.marker(s.ll, { icon: pin(owner, false), keyboard: false, riseOnHover: true, zIndexOffset: Z[s.kind] || 0 })
      .on('click', () => {
        stopPlay();
        const at = idx.indexOf(cur);
        go(at >= 0 ? idx[(at + 1) % idx.length] : idx[0]);
      }).addTo(map);
    mk.bindTooltip(idx.map((j) => `${S[j].num}. ${esc(S[j].title)}`).join('<br>'), { direction: 'top', offset: [0, -14] });
    markers[owner] = mk;
  });

  L.control.layers({ 'Map': topo, 'Satellite': sat, 'OpenStreetMap': osm }, { 'Path of totality': pathLayer, 'Route': routeLayer }, { position: 'topright' }).addTo(map);
  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = () => {
    const d = L.DomUtil.create('div', 'legend');
    d.innerHTML = '<div><i style="border-color:#6366F1;border-top-style:dashed"></i>Flight</div>' +
      '<div><i style="border-color:#334155"></i>Drive</div>' +
      '<div><i style="border-color:#0D9488;border-top-style:dotted"></i>Train</div>' +
      '<div><i style="border-color:#0284C7;border-top-style:dashed"></i>Ferry / boat</div>' +
      '<div><span class="sw"></span>Path of totality</div>';
    return d;
  };
  legend.addTo(map);

  // ---------- panel
  const card = document.getElementById('card'), tl = document.getElementById('timeline');
  const btnPrev = document.getElementById('prev'), btnNext = document.getElementById('next');
  const btnPlay = document.getElementById('play'), btnAll = document.getElementById('all');
  document.getElementById('subtitle').textContent = DATA.route.subtitle;
  document.getElementById('rswitch').innerHTML = DATA.route.switch.map((r) =>
    `<a href="${r.href}" class="${r.on ? 'on' : ''}">${esc(r.label)}</a>`).join('');
  const days = Math.ceil((Date.parse(DATA.totality_utc) - Date.now()) / 864e5);
  document.getElementById('countdown').innerHTML = days > 0 ? `<b>${days}</b> days<br>to totality` : (days > -1 ? '🌑 Totality day!' : '');

  S.forEach((s, i) => {
    const b = document.createElement('button');
    b.style.setProperty('--c', C[s.cc].pin);
    b.innerHTML = `<b>${esc(s.day)}</b>${esc(s.short)}`;
    b.onclick = () => { stopPlay(); go(i); };
    tl.appendChild(b);
  });

  const tempClass = (t) => (t < 30 ? 't-g' : t <= 35 ? 't-a' : 't-r');
  function render(i) {
    const s = S[i], c = C[s.cc], ph = s.photos, chips = [];
    if (s.temp) chips.push(`<span class="chip ${tempClass(s.temp)}">🌡️ ${s.temp}°C / ${Math.round(s.temp * 9 / 5 + 32)}°F</span>`);
    if (s.kind !== 'eclipse' && s.ecl && s.ecl.total) chips.push(`<span class="chip path">🌑 In the path: ${s.ecl.total} of totality on Aug 2</span>`);
    if (s.ecl && s.ecl.partial && /^el-gouna/.test(s.id)) chips.push(`<span class="chip partial">🌘 Only a ${s.ecl.partial} partial here</span>`);
    (s.badges || []).forEach((b) => chips.push(`<span class="chip badge">${esc(b)}</span>`));
    const arrive = s.arrive ? `<div class="arrive"><span class="ic">${MODES[s.arrive[0]].icon}</span><span>${esc(s.arrive[1])}</span></div>` : '';
    const gmaps = s.ll ? `<a href="https://www.google.com/maps/search/?api=1&query=${s.ll[0]},${s.ll[1]}" target="_blank" rel="noopener">📍 Open in Google Maps</a>` : '';
    card.className = 'card' + (s.kind === 'eclipse' ? ' eclipse' : '');
    card.innerHTML = `
      <figure class="photo" id="gal" style="--soft:${c.soft}">
        <div class="slides">${ph.map((p, k) => `<img class="slide${k === 0 ? ' on' : ''}" ${k === 0 ? 'src' : 'data-src'}="${p.src}" alt="${esc(p.cap)}">`).join('')}</div>
        <div class="cap" id="gcap">${esc(ph[0].cap)}</div>
        ${ph.length > 1 ? `<button class="g-nav g-prev" aria-label="Previous photo">‹</button><button class="g-nav g-next" aria-label="Next photo">›</button>
        <div class="dots">${ph.map((_, k) => `<i class="${k === 0 ? 'on' : ''}" data-k="${k}"></i>`).join('')}</div>` : ''}
        <button class="g-full" aria-label="Full screen photo">⤢</button>
        <span class="num">${s.ll ? `${s.num} / ${total}` : `${total} stops`}</span><span class="cc">${c.flag} ${esc(c.name)}</span>
      </figure>
      <div class="body">
        <div class="kicker"><b>${esc(s.dates)}</b> · ${esc(s.nights)}</div>
        <h2>${esc(s.title)}</h2>
        ${s.base ? `<div class="base">${esc(s.base)}</div>` : ''}
        ${chips.length ? `<div class="chips">${chips.join('')}</div>` : ''}
        ${arrive}
        <ul class="b">${s.bullets.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>
        <div class="foot"><span id="gcredit">${credit(ph[0])}</span>${gmaps}</div>
      </div>`;
    gi = 0;
    gpaused = false;
    const gal = card.querySelector('#gal');
    gal.querySelector('.slide').style.transformOrigin = ORIGINS[i % ORIGINS.length];
    gal.addEventListener('click', (e) => {
      const nav = e.target.closest('.g-nav'), dot = e.target.closest('.dots i');
      if (nav) { showSlide(gi + (nav.classList.contains('g-next') ? 1 : -1), true); return; }
      if (dot) { showSlide(+dot.dataset.k, true); return; }
      openLB(gi);
    });
    let gx = null;
    gal.addEventListener('touchstart', (e) => { gx = e.touches[0].clientX; }, { passive: true });
    gal.addEventListener('touchend', (e) => {
      if (gx === null) return;
      const dx = e.changedTouches[0].clientX - gx;
      gx = null;
      if (Math.abs(dx) > 40 && ph.length > 1) { e.preventDefault(); showSlide(gi + (dx < 0 ? 1 : -1), true); }
    });
    const nx = gal.querySelectorAll('.slide')[1];
    if (nx) nx.src = nx.dataset.src;
    clearInterval(gtimer);
    if (ph.length > 1) gtimer = setInterval(() => { if (!gpaused && lbi < 0 && !document.hidden) showSlide(gi + 1); }, 4800);
  }

  // ---------- photo gallery + lightbox
  const ORIGINS = ['50% 50%', '30% 35%', '70% 35%', '35% 70%', '65% 65%', '50% 30%'];
  let gi = 0, gtimer = null, gpaused = false, lbi = -1;
  function credit(p) {
    return `📷 <a href="${p.page}" target="_blank" rel="noopener">${esc(p.artist)}</a> · ${esc(p.license)}`;
  }
  function showSlide(k, user) {
    const ph = S[cur].photos, n = ph.length, slides = card.querySelectorAll('.slide');
    gi = ((k % n) + n) % n;
    slides.forEach((im, j) => {
      if (j === gi) {
        if (!im.getAttribute('src')) im.src = im.dataset.src;
        im.style.transformOrigin = ORIGINS[(cur + j) % ORIGINS.length];
        im.classList.remove('on');
        void im.offsetWidth;
        im.classList.add('on');
      } else im.classList.remove('on');
    });
    const nx = slides[(gi + 1) % n];
    if (nx && !nx.getAttribute('src')) nx.src = nx.dataset.src;
    card.querySelectorAll('.dots i').forEach((d, j) => d.classList.toggle('on', j === gi));
    document.getElementById('gcap').textContent = ph[gi].cap;
    document.getElementById('gcredit').innerHTML = credit(ph[gi]);
    if (user) gpaused = true;
  }
  const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg');
  function lbShow(k) {
    const ph = S[cur].photos, n = ph.length;
    lbi = ((k % n) + n) % n;
    const p = ph[lbi];
    lbimg.src = p.big || p.src;
    lbimg.alt = p.cap;
    document.getElementById('lbcap').textContent = p.cap;
    document.getElementById('lbcredit').innerHTML = credit(p);
    document.getElementById('lbp').style.display = document.getElementById('lbn').style.display = n > 1 ? '' : 'none';
    const nxt = ph[(lbi + 1) % n];
    if (nxt) { const im = new Image(); im.src = nxt.big || nxt.src; }
  }
  function openLB(k) { stopPlay(); lb.hidden = false; lbShow(k); }
  function closeLB() { if (lbi >= 0) showSlide(lbi, true); lb.hidden = true; lbi = -1; lbimg.removeAttribute('src'); }
  document.getElementById('lbx').onclick = closeLB;
  document.getElementById('lbp').onclick = (e) => { e.stopPropagation(); lbShow(lbi - 1); };
  document.getElementById('lbn').onclick = (e) => { e.stopPropagation(); lbShow(lbi + 1); };
  lb.addEventListener('click', (e) => { if (e.target === lb) closeLB(); });
  let lx = null;
  lb.addEventListener('touchstart', (e) => { lx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', (e) => {
    if (lx === null) return;
    const dx = e.changedTouches[0].clientX - lx;
    lx = null;
    if (Math.abs(dx) > 40) lbShow(lbi + (dx < 0 ? 1 : -1));
  });

  // Show the journey (incoming legs) first, then land on the stop if that's a big zoom jump.
  let viewToken = 0;
  function view(s, instant) {
    const token = ++viewToken, p = pad();
    if (!s.ll) { instant ? map.fitBounds(allBounds, padOpt()) : map.flyToBounds(allBounds, { ...padOpt(), duration: 1.3 }); return; }
    const z = s.zoom || 10;
    const legs = (s.legs || []).map((id) => legLayers[id]).filter(Boolean);
    if (!legs.length) { instant ? map.setView(s.ll, z) : map.flyTo(s.ll, z, { duration: 1.3 }); return; }
    const b = L.latLngBounds([s.ll]);
    legs.forEach((l) => b.extend(l.getBounds()));
    const fitZ = map.getBoundsZoom(b, false, L.point(p[0] * 2, p[1] * 2));
    if (fitZ + 1.5 >= z) { instant ? map.fitBounds(b, { ...padOpt(), maxZoom: z }) : map.flyToBounds(b, { ...padOpt(), maxZoom: z, duration: 1.3 }); return; }
    if (instant) { map.setView(s.ll, z); return; }
    map.flyToBounds(b, { ...padOpt(), duration: 1.2 });
    map.once('moveend', () => setTimeout(() => { if (token === viewToken) map.flyTo(s.ll, z, { duration: 1.6 }); }, 900));
  }

  let cur = -1;
  function go(i, opts = {}) {
    i = Math.max(0, Math.min(S.length - 1, i));
    const prev = cur;
    cur = i;
    const s = S[i];
    render(i);
    const po = prev >= 0 ? ownerOf[prev] : -1, co = ownerOf[i];
    if (po >= 0 && markers[po] && po !== co) markers[po].setIcon(pin(po, false)).setZIndexOffset(Z[S[po].kind] || 0);
    if (markers[co]) markers[co].setIcon(pin(co, true)).setZIndexOffset(1000);
    Object.values(legLayers).forEach((l) => { const e = l.getElement(); if (e) e.classList.remove('active'); });
    (s.legs || []).forEach((id) => { const l = legLayers[id]; const e = l && l.getElement(); if (e) { e.classList.add('active'); l.bringToFront(); } });
    [...tl.children].forEach((b, j) => b.classList.toggle('on', j === i));
    tl.children[i].scrollIntoView({ block: 'nearest', inline: 'center', behavior: opts.instant ? 'auto' : 'smooth' });
    btnPrev.disabled = i === 0;
    btnNext.disabled = i === S.length - 1;
    view(s, opts.instant);
    history.replaceState(null, '', '#' + s.id);
    [i - 1, i + 1].forEach((j) => { if (S[j]) { const im = new Image(); im.src = S[j].photos[0].src; } });
    if (isMobile() && !opts.instant) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  let timer = null;
  function play() {
    if (timer) { stopPlay(); return; }
    if (cur >= S.length - 1) go(0);
    timer = setInterval(() => { if (cur >= S.length - 1) { stopPlay(); return; } go(cur + 1); }, 8500);
    btnPlay.textContent = '⏸ Pause';
  }
  function stopPlay() { if (timer) { clearInterval(timer); timer = null; } btnPlay.textContent = '▶ Play'; }

  btnPrev.onclick = () => { stopPlay(); go(cur - 1); };
  btnNext.onclick = () => { stopPlay(); go(cur + 1); };
  btnPlay.onclick = play;
  btnAll.onclick = () => { stopPlay(); go(0); };
  map.on('dragstart', stopPlay);
  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (lbi >= 0) {
      if (e.key === 'ArrowRight') lbShow(lbi + 1);
      else if (e.key === 'ArrowLeft') lbShow(lbi - 1);
      else if (e.key === 'Escape') closeLB();
      return;
    }
    if (e.key === 'ArrowRight') { stopPlay(); go(cur + 1); }
    else if (e.key === 'ArrowLeft') { stopPlay(); go(cur - 1); }
    else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); play(); }
    else if (e.key === 'Home') { stopPlay(); go(0); }
    else if (e.key === 'End') { stopPlay(); go(S.length - 1); }
  });
  let x0 = null;
  card.addEventListener('touchstart', (e) => { x0 = e.target.closest('#gal') ? null : e.touches[0].clientX; }, { passive: true });
  card.addEventListener('touchend', (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) > 60) { stopPlay(); go(cur + (dx < 0 ? 1 : -1)); }
  });
  window.addEventListener('resize', () => map.invalidateSize());
  window.addEventListener('hashchange', () => {
    const j = S.findIndex((s) => '#' + s.id === location.hash);
    if (j >= 0 && j !== cur) { stopPlay(); go(j); }
  });

  const fromHash = S.findIndex((s) => '#' + s.id === location.hash);
  go(fromHash >= 0 ? fromHash : 0, { instant: true });
})();
</script>
</body>
</html>
